name: aviones

on:
  schedule:
    - cron: "*/15 * * * *"   # cada 15 min; con la cola de concurrency siempre hay una ejecución pendiente
  workflow_dispatch:

# Si una ejecución se retrasa, la siguiente espera en vez de solaparse
concurrency:
  group: aviones
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 59
    steps:
      - uses: actions/checkout@v5

      # Conserva entre ejecuciones el modo elegido con los comandos, las ubicaciones
      # y el último mensaje leído. Cada ejecución guarda una caché nueva y restaura la última.
      - name: Restaurar estado
        uses: actions/cache@v5
        with:
          path: state.json
          key: aviones-state-${{ github.run_id }}
          restore-keys: aviones-state-

      - name: Vigilar aviones
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}  # opcional
          LOCATION_TOKEN: ${{ secrets.LOCATION_TOKEN }}        # opcional: ubicación desde el móvil (Automate)
          DURATION_S: "3300"
          PHOTO_MODE: "preview"
          DEFAULT_MODE: "helicopteros"   # sin comando: helicopteros | aviones | todo
        run: python3 poll.py
